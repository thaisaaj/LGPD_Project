<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>
  body{font-family:Arial,sans-serif;max-width:640px;margin:30px auto;color:#222}
  label{display:block;margin-top:10px} input,select{width:100%;padding:6px}
  #aviso-cookies{position:fixed;bottom:0;left:0;right:0;background:#333;color:#fff;padding:14px}
</style>
</head>
<body>
<h1>Crie sua conta e ganhe 10% de desconto</h1>
<form id="cadastro" method="get" action="/obrigado">
  <label for="nome">Nome completo *</label><input id="nome" name="nome" required>
  <label for="email">E-mail *</label><input id="email" name="email" type="email" required>
  <label for="cpf">CPF *</label><input id="cpf" name="cpf" required>
  <label for="rg">RG *</label><input id="rg" name="rg" required>
  <label for="mae">Nome da mãe *</label><input id="mae" name="nome_mae" required>
  <label for="nasc">Data de nascimento *</label><input id="nasc" name="nascimento" type="date" required>
  <label for="cel">Celular *</label><input id="cel" name="celular" type="tel" required>
  <label for="renda">Renda mensal *</label>
  <select id="renda" name="renda" required><option>Até R$ 2.000</option><option>R$ 2.000 a 5.000</option><option>Acima de R$ 5.000</option></select>
  <label for="civil">Estado civil</label><input id="civil" name="estado_civil">
  <label for="religiao">Religião</label><input id="religiao" name="religiao">
  <label for="raca">Cor/raça</label>
  <select id="raca" name="raca"><option>Branca</option><option>Preta</option><option>Parda</option><option>Amarela</option><option>Indígena</option></select>
  <label for="senha">Senha *</label><input id="senha" name="senha" type="password" required>
  <label><input type="checkbox" name="aceite" checked> Li e aceito os termos de uso e concordo em receber ofertas e novidades de parceiros por e-mail e WhatsApp</label>
  <button type="submit">Criar conta</button>
</form>

<div id="aviso-cookies">Este site utiliza cookies para melhorar sua experiência de navegação. <button>Aceitar</button></div>
</body>
</html>
